name: ci

on:
  push:
    branches: [manhattan, rorschach]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # Store tests skip themselves without a database, so CI supplies one.
    # The schema invariant they check — every resource table is owner-scoped —
    # only has to be forgotten once to be expensive.
    #
    # 16 because that is what `apt-get install postgresql` gives on the Debian
    # and Ubuntu releases install.sh supports, and testing against a version
    # nobody runs is how a migration that only works on a newer server ships.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ozymandis
          POSTGRES_PASSWORD: ozymandis
          POSTGRES_DB: ozymandis
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      OZYMANDIS_TEST_DATABASE_URL: postgres://ozymandis:ozymandis@localhost:5432/ozymandis?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify templ output is current
        run: |
          go tool templ generate
          git diff --exit-code -- '*_templ.go' \
            || (echo "::error::templ output is stale — run 'make generate' and commit" && exit 1)

      # The compiled stylesheet is committed so `go build` works without the
      # Tailwind CLI. That only holds if it is actually kept in sync, so CI
      # rebuilds it and fails on any drift.
      - name: Verify stylesheet is current
        run: |
          make css
          git diff --exit-code -- internal/web/assets/css/app.css \
            || (echo "::error::stylesheet is stale — run 'make css' and commit" && exit 1)

      # These two get piped into a root shell on somebody else's machine, which
      # is the least forgiving place for a quoting mistake to surface.
      - name: Shellcheck the install and upgrade scripts
        run: |
          shellcheck -s sh install.sh upgrade.sh
          sh -n install.sh && sh -n upgrade.sh

      - name: Vet
        run: go vet ./...

      # A database test with no database does not fail, it skips — and a skip
      # reports as a pass. This workflow went on setting YACHT_TEST_DATABASE_URL
      # after the tests were renamed to read OZYMANDIS_TEST_DATABASE_URL, so
      # every store, account and cluster test quietly did not run while CI
      # stayed green. Nothing about that looks wrong from the outside, which is
      # why it needs a step of its own.
      #
      # The variable's name is read out of the test source rather than written
      # here a second time, because a second copy of it is precisely what
      # drifted.
      - name: The database tests must be able to run
        run: |
          set -eu
          names=$(grep -rhoE '"[A-Z_]+TEST_DATABASE_URL"' --include='*_test.go' ./internal \
                  | tr -d '"' | sort -u)
          count=$(printf '%s\n' "$names" | grep -c . || true)
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly one test DSN variable, found: ${names:-none}"
            exit 1
          fi
          eval "value=\${${names}:-}"
          if [ -z "$value" ]; then
            echo "::error::the tests read ${names}, which this workflow does not set"
            exit 1
          fi
          echo "database tests will run against ${names}"

      - name: Test
        run: go test ./... -race -count=1

      - name: Build
        run: CGO_ENABLED=0 go build ./...

      # The engine must remain useful standalone at a single owner. If it ever
      # grows a commercial concept, the open-core boundary has leaked and the
      # wrapping layer's only options become fork or rewrite.
      #
      # Checks declarations rather than free text, so prose like "a wrapping
      # application is multi-tenant" in a doc comment does not trip it.
      - name: Boundary check — no commercial concepts declared in the engine
        run: |
          # internal/web/ui is vendored templUI, copied in unmodified. The Lucide
          # set it ships declares `var Wallet`, and an icon named after a wallet
          # is not a billing concept — it is a picture. Scanning it would train
          # the reader to ignore this check, which is the only way a check like
          # this actually fails.
          if grep -rnE '^[[:space:]]*(type|func|var|const)[[:space:]]+[A-Za-z_]*(Tenant|tenant|Wallet|wallet|Billing|billing|Invoice|invoice|Subscription)' \
               --include='*.go' --exclude-dir=ui ./cmd ./internal 2>/dev/null; then
            echo "::error::engine declares a commercial-layer concept — it belongs in the wrapping layer"
            exit 1
          fi
          echo "boundary clean: no commercial declarations in engine code"
