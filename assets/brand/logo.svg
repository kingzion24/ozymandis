<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Ozymandis">
    <!--
      The mark is the letter O, drawn.
      A ring rather than a glyph, because a font cannot be relied on to be
      installed and an outlined glyph is a name no search can read — which is
      how the previous wordmark went on saying "Yacht" for months. The name
      itself is text beside this, so nothing here has to be read to know it.

      The counter is an ellipse, not a circle: 64 across and 66 down. Equal
      radii look wrong at this weight, because a stroke of constant thickness
      reads heavier where it runs horizontally. Thinning the top and bottom by
      four units is the correction every geometric typeface makes to its O.
    -->
    <defs>
        <linearGradient id="ozymandis-o" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" style="stop-color:rgb(74,168,154)"/>
            <stop offset="1" style="stop-color:rgb(33,149,132)"/>
        </linearGradient>
    </defs>
    <path fill-rule="evenodd" style="fill:url(#ozymandis-o)" d="M 16,128 a 112,112 0 1,0 224,0 a 112,112 0 1,0 -224,0 Z M 64,128 a 64,66 0 1,0 128,0 a 64,66 0 1,0 -128,0 Z"/>
</svg>
